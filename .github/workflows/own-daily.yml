name: OWN Daily Report

on:
  # 2026-07-30: triggering moved BACK to native GitHub cron, so the report is
  # fully self-contained in this repo — no external scheduler, no personal
  # access token to expire, no third-party account. Nothing outside GitHub is
  # needed to keep it running.
  #
  # History worth knowing: native cron was abandoned in June 2026 after GitHub
  # silently dropped the schedule on 06-17/06-18 (a workflow that had been
  # disabled and re-enabled never got re-registered, while still reporting
  # state:active). Two things make it safe again here: this schedule is being
  # created fresh rather than re-enabled, and each run commits updated history,
  # which keeps the repo active — GitHub auto-disables scheduled workflows in
  # repos with 60 days of no commits.
  #
  # Known and accepted: GitHub's scheduler is best-effort and can run late
  # under load, so the email may land anywhere from 08:45 to ~09:15 IST. It is
  # never early. If exact timing ever matters, an external scheduler hitting
  # workflow_dispatch is the precise option.
  #
  # HEALTH SIGNAL: every successful run pushes a "chore: update own_scorer
  # history [skip ci]" commit. No new commit for a day = the report did not
  # run. That is the cheapest way to spot a silent stop.
  schedule:
    - cron: "15 3 * * *"    # 03:15 UTC = 08:45 IST
  workflow_dispatch:        # manual break-glass, and test sends
    inputs:
      recipient_override:
        description: "Comma-separated emails (overrides default list). Blank = normal recipients."
        required: false
        default: ""
      skip_history_commit:
        description: "Skip committing updated history JSON (use for test runs)"
        required: false
        type: boolean
        default: false

concurrency:
  group: apify-daily
  cancel-in-progress: false

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    env:
      APIFY_TOKEN:     ${{ secrets.APIFY_TOKEN }}
      GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
      GMAIL_USER:      ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS:  ${{ secrets.GMAIL_APP_PASS }}
      # Optional, and normally UNSET. @foodpharmer's grid is scraped directly
      # since the FoodPharmer report was retired. Only set this if a published
      # history JSON ever exists again; "off" drops the FoodPharmer-effect box
      # and the collab cross-match entirely.
      FP_HISTORY_URL:  ${{ vars.FP_HISTORY_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        working-directory: own_scorer
        env:
          EMAIL_TO_OVERRIDE: ${{ inputs.recipient_override }}
        run: python scraper.py

      - name: Commit updated history
        if: ${{ inputs.skip_history_commit != true }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add own_scorer/history_own.json \
                  own_scorer/followers_own.json \
                  own_scorer/snapshots_own.json
          git add own_scorer/competitors_own.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update own_scorer history [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying after backoff..."
            sleep $((RANDOM % 15 + 5))
          done
          echo "Push failed after 5 attempts"
          exit 1
